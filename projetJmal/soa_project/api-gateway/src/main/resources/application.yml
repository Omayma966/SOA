spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: student-service
          uri: lb://student-service
          predicates:
            - Path=/api/student/**
          filters:
            - name: CustomPreFilter
            
        - id: address-service
          uri: lb://address-service
          predicates:
            - Path=/api/address/**
          filters:
            - name: CustomPostFilter
            

server:
  port: 9090

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
